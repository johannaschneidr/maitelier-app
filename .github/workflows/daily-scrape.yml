name: Daily Scrape

on:
  schedule:
    - cron: '0 10 * * *' # 6am ET (UTC-4 in summer)
  workflow_dispatch: # allow manual runs from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-24.04 # Playwright 1.59 does not support ubuntu-latest (26.04)
    timeout-minutes: 30
    env:
      TZ: America/New_York # scrapers read wall-clock times off NYC studio sites

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run all scrapers
        run: npm run scrape all
